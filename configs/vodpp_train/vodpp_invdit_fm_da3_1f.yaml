defaults:
  - vodpp_dit_fm
  - _self_
n_obs_steps: 1

shape_meta:
  obs:
    head_cam:
      shape: ${image_shape}
      type: rgb
    front_cam:
      shape: ${image_shape}
      type: rgb
    agent_pos:
      shape: [14]
      type: low_dim
      
mixed_precision: "bf16"
output_dir: "checkpoints/vodpp/${train_dataset.task}_${train_dataset.demo}/invdit_fm_da3_1f"

model:
  block_type: invblock
  obs_encoder:
    state_key: null
    # rgb_key: ["head_cam", "front_cam"]
    emvis_config:
      dim_2d: 3072
      dim_3d: 1536
      dim_3d_keys: ['frame', 'global']
      vggt_target: 'da3'
      load_vggt_heads: false
      load_vggt_pretrain: true
      vggt_model_path: pretrained/DA3NESTED-GIANT-LARGE
      interpolate: 'bilinear'
      mlp_ratio: 1.0
      drop_p: 0.0
      ft_heads: []
      ft_layer_idx: []
      intermediate_layer_idx: [-1]
      seq_as_view: False
      only_first_view: True
      injector_config:
        fuse_2d: False
        fuse_3d: False
        ffn_layer_num: 1
        dim_out: 1024
      model_adapter_config:
        target: ResNetAdapter
        shape_out: [2, 2]
        dim_out: 1024
        conv_num: 3
      mv_fuser_config: {}
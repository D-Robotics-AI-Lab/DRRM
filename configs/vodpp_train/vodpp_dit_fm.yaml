# --------------------------- trainer config
# trainer function
_target_: drrm.trainer.train.train
# Number of updates steps to accumulate before performing a backward/update pass.
gradient_accumulation_steps: 1
# Whether to use mixed precision. Choose between fp16 and bf16 (bfloat16). Bf16 requires PyTorch >= 1.10.and an Nvidia Ampere GPU.  
# Default to the value of accelerate config of the current system or the flag passed with the `accelerate.launch` command. 
# Use this argument to override the accelerate config.
mixed_precision: "bf16" # "no", "fp16", "bf16"
# The integration to report the results and logs to. Supported platforms are `"tensorboard"` (default), `"wandb"` and `"comet_ml"`. 
# Use `"all"` to report to all integrations.
report_to: "wandb"
# The output directory where the model predictions and checkpoints will be written.
output_dir: checkpoints/vodp_${train_dataset.task}_${train_dataset.demo}_base
# [TensorBoard](https://www.tensorflow.org/tensorboard) log directory. Will default to *output_dir/runs/**CURRENT_DATETIME_HOSTNAME***.
logging_dir: logs
# Max number of checkpoints to store. Passed as `total_limit` to the `Accelerator` `ProjectConfiguration`.
# See Accelerator::save_state https://huggingface.co/docs/accelerate/package_reference/accelerator#accelerate.Accelerator.save_state for more details
checkpoints_total_limit: 4
# A seed for reproducible training.
seed: 42
# Whether or not to use gradient checkpointing to save memory at the expense of slower backward pass.
gradient_checkpointing: False
# Whether or not to allow TF32 on Ampere GPUs. Can be used to speed up training. For more information, 
# see https://pytorch.org/docs/stable/notes/cuda.html#tensorfloat-32-tf32-on-ampere-devices
allow_tf32: False
# Initial learning rate (after the potential warmup period) to use.
learning_rate: 1e-4
# The beta1 parameter for the Adam optimizer.
adam_beta1: 0.95
# The beta2 parameter for the Adam optimizer.
adam_beta2: 0.999
# The weight decay to use.
adam_weight_decay: 1e-6
# The epsilon value to use.
adam_epsilon: 1e-8
# Number of training epochs.
num_train_epochs: 300
# Batch size (all devices) for the training dataloader.
train_batch_size: 128
# Batch size (per device) for the validation dataloader.
val_batch_size: 64
# Number of batches to sample from the validation dataset.
num_val_batches: 2
# Number of subprocesses to use for data loading. 0 means that the data will be loaded in the main process.
dataloader_num_workers: 4
# The scheduler type to use. Choose between ["linear", "cosine", "cosine_with_restarts", "polynomial", "constant", "constant_with_warmup"]
lr_scheduler: cosine
# Number of steps for the warmup in the lr scheduler.
lr_warmup_ratio: 0.05
# Number of hard resets of the lr in cosine_with_restarts scheduler.
lr_num_cycles: 1
# Power factor of the polynomial scheduler.
lr_power: 1.0
# Whether training should be resumed from a previous checkpoint. Use a path saved by
# `--checkpointing_period`, or `"latest"` to automatically select the last available checkpoint.
resume_from_checkpoint: null
# Save more memory by using setting grads to None instead of zero. Be aware, that this changes certain behaviors, 
# so disable this argument if it causes any problems. More info:
# https://pytorch.org/docs/stable/generated/torch.optim.Optimizer.zero_grad.html
set_grads_to_none: False
# Max gradient norm.
max_grad_norm: 1.0
# Save a checkpoint of the training state every X updates. Checkpoints can be used for resuming training via `--resume_from_checkpoint`. 
# In the case that the checkpoint is better than the final trained model, the checkpoint can also be used for inference.
# Using a checkpoint for inference requires separate loading of the original pipeline and the individual checkpointed model components.
# See https://huggingface.co/docs/diffusers/main/en/training/dreambooth#performing-inference-using-a-saved-checkpoint for step by step instructions.
checkpointing_period: 20000
# Run sampling every X steps. During the sampling phase, the model will sample a trajectory 
# and report the error between the sampled trajectory and groud-truth trajectory in the training batch.
val_period: -1


# ------------------------------- model config
image_shape: [3, 240, 320]
shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    head_cam:
      shape: ${image_shape}
      type: rgb
    # front_cam:
    #   shape: *image_shape
    #   type: rgb
    # left_cam:
    #   shape: *image_shape
    #   type: rgb
    # right_cam:
    #   shape: *image_shape
    #   type: rgb
    agent_pos:
      shape: [14]
      type: low_dim
  action:
    shape: [14]
horizon: 8
n_obs_steps: 3
n_action_steps: 8
n_latency_steps: 0
model:
  target_config: drrm.models.VODPPlusDitFlowMatchingConfig
  target_policy: drrm.models.VODPPlusDitFlowMatching
  shape_meta: ${shape_meta}
  noise_scheduler:
    num_train_timesteps: 1000
    num_inference_timesteps: 10
    beta_schedule: squaredcos_cap_v2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    prediction_type: velocity
  obs_encoder:
    _target_: drrm.models.VODPPlusEncoder
    shape_meta: ${shape_meta}
    emvis_config: null
    resize_shape: null
    crop_shape: null
    # constant center crop
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True
  scene_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  hidden_size: 2048
  depth: 8 # 28
  num_heads: 32 # 32
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  # crop_shape: null
  diffusion_step_embed_dim: 128
  # down_dims: [512, 1024, 2048]
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
ema:
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999


# ------------------------------- dataset config
train_dataset:
  task: null
  demo: null
  path: null
  _target_: drrm.datasets.drrm_dataset.DRRMDataset
  root: ${train_dataset.path}/${train_dataset.task}
  repo_id: D-robotics/${train_dataset.task}
  horizon: ${horizon}
  pad_before: 3
  pad_after: 3
  seed: 42
  val_ratio: 0.02
  max_train_episodes: ${train_dataset.demo}
  npy_feature_keys: null
  # - spatial_tokens_23
  # - image_tokens_pos
  dataset_metadata:
    _target_: lerobot.datasets.lerobot_dataset.LeRobotDatasetMetadata
    root: ${train_dataset.root}
    repo_id: ${train_dataset.repo_id}

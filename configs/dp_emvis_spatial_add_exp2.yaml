defaults:
  - dp_baseline
  - _self_



model:
  obs_encoder:
    _target_: drrm.models.policy.diffusion_policy.multi_image_obs_encoder_emvis_exp1.MultiImageObsEncoderEmvisExp1
    out_channels: 526
    emvis_config:
      load_vggt_pretrain: true
      vggt_model_path: pretrained/VGGT-1B/model.pt/VGGT-1B/model.pt
      mlp_ratio: 4.0
      intermediate_layer_idx: [23]
      model_adapter_config:
        shape_out: [1, 1]
        dim_out: 512
  out_channels: ${model.obs_encoder.out_channels}

train_dataset:
  root: datasets/lerobot/dual_bottles_pick_hard_D435_drrm
  repo_id: D-robotics/dual_bottles_pick_hard_D435_drrm
  npy_feature_keys: ['spatial_tokens_23', 'image_tokens_pos']
  dataset_metadata:
    root: ${train_dataset.root}
    repo_id: ${train_dataset.repo_id}